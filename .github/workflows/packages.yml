name: Linux packages and official release
on:
  push:
    branches: [main, linux-compatibility-0.3]
  pull_request:
    branches: [main, linux-compatibility-0.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo python3-reportlab python3-pil python3-xlib gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-graphene-1.0 gir1.2-secret-1 fonts-dejavu-core librsvg2-common libfuse2 xvfb xauth
      - name: Download verified packaging tools
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool' | sha256sum -c -
          chmod +x /tmp/appimagetool
          curl -fsSL -o /tmp/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/runtime-x86_64' | sha256sum -c -
      - name: Build AppImage
        run: |
          /usr/bin/python3 packaging/appimage/build.py /tmp/AppDir
          PYTHONHOME=/tmp/AppDir/usr PYTHONPATH=/tmp/AppDir/usr/lib/python3/dist-packages:/tmp/AppDir/usr/share/time-sheet-linux LD_LIBRARY_PATH=/tmp/AppDir/usr/lib GI_TYPELIB_PATH=/tmp/AppDir/usr/lib/girepository-1.0 /tmp/AppDir/usr/bin/python3 /tmp/AppDir/usr/share/time-sheet-linux/check-runtime.py
          dbus-run-session -- env PYTHONHOME=/tmp/AppDir/usr PYTHONPATH=/tmp/AppDir/usr/lib/python3/dist-packages:/tmp/AppDir/usr/share/time-sheet-linux LD_LIBRARY_PATH=/tmp/AppDir/usr/lib GI_TYPELIB_PATH=/tmp/AppDir/usr/lib/girepository-1.0 /tmp/AppDir/usr/bin/python3 packaging/verify_secret_portal.py
          mkdir -p dist
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool --runtime-file /tmp/runtime-x86_64 --mksquashfs-opt -processors --mksquashfs-opt 2 /tmp/AppDir dist/TimeSheetLinux-x86_64.AppImage
          (cd dist && sha256sum TimeSheetLinux-x86_64.AppImage > AppImage-SHA256SUMS)
      - name: Smoke test AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/TimeSheetLinux-x86_64.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 dist/TimeSheetLinux-x86_64.AppImage --diagnose 2> /tmp/appimage-diagnostic.log
          cat /tmp/appimage-diagnostic.log
          ! grep -E "Failed to load module|g_module_open\(\) failed|undefined symbol" /tmp/appimage-diagnostic.log
          export APPIMAGE_EXTRACT_AND_RUN=1 TIMESHEET_TESTING=1 XDG_DATA_HOME=/tmp/appimage-data GDK_BACKEND=x11
          xvfb-run -a timeout 10 dist/TimeSheetLinux-x86_64.AppImage 2> /tmp/appimage-ui.log || test "$?" = 124
          cat /tmp/appimage-ui.log
          ! grep -E "Failed to load module|g_module_open\(\) failed|undefined symbol|Theme parser error" /tmp/appimage-ui.log
      - uses: actions/upload-artifact@v4
        with:
          name: TimeSheetLinux-AppImage-x86_64
          path: |
            dist/TimeSheetLinux-x86_64.AppImage
            dist/AppImage-SHA256SUMS
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak tools and SDK
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder python3-gi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --user --repo=/tmp/ts-repo /tmp/ts-build packaging/flatpak/org.local.TimeSheetLinux.yml
          mkdir -p dist
          flatpak build-bundle /tmp/ts-repo dist/TimeSheetLinux-x86_64.flatpak org.local.TimeSheetLinux --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          (cd dist && sha256sum TimeSheetLinux-x86_64.flatpak > Flatpak-SHA256SUMS)
      - name: Smoke test bundled PDF exporter
        run: |
          flatpak install --user -y --noninteractive dist/TimeSheetLinux-x86_64.flatpak
          mkdir -p /tmp/ts-runtime && chmod 700 /tmp/ts-runtime
          export XDG_RUNTIME_DIR=/tmp/ts-runtime
          dbus-run-session -- flatpak run --user --no-documents-portal --env=TIMESHEET_TESTING=1 --command=python3 org.local.TimeSheetLinux -c 'from timesheet.pdf_export import report_pdf; r={"client":"Client","project":"Project","task":"Task","description":"Test","start":0,"end":3600,"rate":6000,"amount":6000,"currency":"GBP"}; assert report_pdf([r],1).startswith(b"%PDF")'
          dbus-run-session -- flatpak run --user --no-documents-portal --command=python3 org.local.TimeSheetLinux /app/libexec/timesheet-check-runtime.py
      - name: Verify sandbox Secret portal storage and fail-closed behaviour
        run: |
          mkdir -p /tmp/ts-secret-runtime && chmod 700 /tmp/ts-secret-runtime
          export XDG_RUNTIME_DIR=/tmp/ts-secret-runtime
          dbus-run-session -- /usr/bin/python3 packaging/verify_secret_portal.py --flatpak org.local.TimeSheetLinux
      - uses: actions/upload-artifact@v4
        with:
          name: TimeSheetLinux-Flatpak-x86_64
          path: |
            dist/TimeSheetLinux-x86_64.flatpak
            dist/Flatpak-SHA256SUMS
  provenance:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [appimage, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TimeSheetLinux-*-x86_64
          merge-multiple: true
          path: dist
      - name: Attest the trusted main build
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/TimeSheetLinux-x86_64.AppImage
            dist/TimeSheetLinux-x86_64.flatpak
      - name: Verify provenance against this workflow and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" dist/provenance.sigstore.json
          gh attestation verify dist/TimeSheetLinux-x86_64.AppImage --repo "$GITHUB_REPOSITORY" --bundle dist/provenance.sigstore.json --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/packages.yml" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
          gh attestation verify dist/TimeSheetLinux-x86_64.flatpak --repo "$GITHUB_REPOSITORY" --bundle dist/provenance.sigstore.json --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/packages.yml" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
      - uses: actions/upload-artifact@v4
        with:
          name: TimeSheetLinux-provenance
          path: dist/provenance.sigstore.json
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: official-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Select an unpublished stable version
        id: version
        run: |
          version=$(/usr/bin/python3 -c 'from timesheet import __version__; print(__version__)')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Skipping official publication for a development version.'
            exit 0
          fi
          tag="v$version"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)]' > /tmp/existing-releases.json
          test "$(jq length /tmp/existing-releases.json)" -le 1
          if jq -e 'any(.[]; .draft == false)' /tmp/existing-releases.json >/dev/null; then
            echo "Official release $tag already exists; leaving published assets unchanged."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Require successful core and UI tests for this exact source
        if: steps.version.outputs.publish == 'true'
        run: |
          for attempt in {1..60}; do
            result=$(gh run list --workflow tests.yml --commit "$GITHUB_SHA" --event push --json status,conclusion --limit 1)
            if [[ "$(jq -r '.[0].status' <<< "$result")" = completed ]]; then
              test "$(jq -r '.[0].conclusion' <<< "$result")" = success
              exit 0
            fi
            sleep 10
          done
          echo 'No successful completed Tests workflow for this source.' >&2
          exit 1
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          pattern: TimeSheetLinux-*
          merge-multiple: true
          path: dist
      - name: Verify exact release files and provenance
        if: steps.version.outputs.publish == 'true'
        run: |
          cat dist/AppImage-SHA256SUMS dist/Flatpak-SHA256SUMS > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          gh attestation verify dist/TimeSheetLinux-x86_64.AppImage --repo "$GITHUB_REPOSITORY" --bundle dist/provenance.sigstore.json --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/packages.yml" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
          gh attestation verify dist/TimeSheetLinux-x86_64.flatpak --repo "$GITHUB_REPOSITORY" --bundle dist/provenance.sigstore.json --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/packages.yml" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
      - name: Upload assets and publish the official latest release
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp "docs/RELEASE_${RELEASE_TAG#v}.md" /tmp/release-notes.md
          printf '\nSource commit: `%s`\n\n[Verified build](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/release-notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]' > /tmp/existing-releases.json
          test "$(jq length /tmp/existing-releases.json)" -le 1
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" --rawfile body /tmp/release-notes.md '{tag_name:$tag,target_commitish:$sha,name:("Time Sheet Linux " + ($tag | ltrimstr("v"))),body:$body,draft:true,prerelease:false,make_latest:"false"}' > /tmp/release-request.json
          if [[ "$(jq length /tmp/existing-releases.json)" = 0 ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input /tmp/release-request.json > /tmp/release-draft.json
          else
            jq -e '.[0].draft == true' /tmp/existing-releases.json
            release_id=$(jq -r '.[0].id' /tmp/existing-releases.json)
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input /tmp/release-request.json > /tmp/release-draft.json
          fi
          jq -e '.draft == true' /tmp/release-draft.json
          test "$(jq -r .target_commitish /tmp/release-draft.json)" = "$GITHUB_SHA"
          release_id=$(jq -r .id /tmp/release-draft.json)
          for name in TimeSheetLinux-x86_64.AppImage TimeSheetLinux-x86_64.flatpak SHA256SUMS provenance.sigstore.json; do
            asset_id=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' /tmp/release-draft.json)
            if [[ -n "$asset_id" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
            curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header 'Content-Type: application/octet-stream' --data-binary "@dist/$name" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" --output /tmp/uploaded-asset.json
            digest=$(sha256sum "dist/$name" | cut -d ' ' -f 1)
            jq -e --arg digest "sha256:$digest" '.state == "uploaded" and .digest == $digest and .size > 0' /tmp/uploaded-asset.json
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" | jq -e '([.assets[].name] | sort) == (["TimeSheetLinux-x86_64.AppImage","TimeSheetLinux-x86_64.flatpak","SHA256SUMS","provenance.sigstore.json"] | sort)'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /tmp/release-tag.json 2>/dev/null; then
            jq -e --arg sha "$GITHUB_SHA" '.object.type == "commit" and .object.sha == $sha' /tmp/release-tag.json
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F prerelease=false -f make_latest=true > /tmp/published-release.json
          jq -e '.draft == false and .prerelease == false and (.assets | length) == 4' /tmp/published-release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" | jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag'
