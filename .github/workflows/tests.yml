name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python bindings
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-xlib python3-reportlab gir1.2-secret-1 poppler-utils xvfb dbus-daemon
      - name: Run accounting, capture and upgrade tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Portal-only encrypted key storage with a private synthetic portal
        run: dbus-run-session -- /usr/bin/python3 packaging/verify_secret_portal.py
      - name: GNOME collector protocol and privacy
        run: XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=GNOME PYTHONPATH=. dbus-run-session -- /usr/bin/python3 tests/verify_collector.py
      - name: KDE bridge protocol (simulated compositor)
        run: PYTHONPATH=. dbus-run-session -- /usr/bin/python3 tests/verify_kde_capture.py
      - name: X11 capture on a virtual X server
        run: PYTHONPATH=. /usr/bin/python3 tests/verify_x11_capture.py
      - name: Separate decision worker and concurrent recording
        run: PYTHONPATH=. /usr/bin/python3 tests/verify_worker_process.py
      - name: Replay public synthetic held-out evidence without network
        run: |
          /usr/bin/python3 -m timesheet.evaluate tests/fixtures/jev_live_heldout_recorded.json
          /usr/bin/python3 -m timesheet.evaluate tests/fixtures/jev_simple_heldout_recorded.json
      - name: Compile Python modules
        run: /usr/bin/python3 -m compileall -q timesheet
      - name: Record bounded synthetic discovery performance (no timing pass threshold)
        run: /usr/bin/python3 -m timesheet.benchmark --observations 20000 --batches 5
      - name: Exercise concurrent personal/work recording and summaries without network
        run: PYTHONPATH=. /usr/bin/python3 tests/soak_screen_time.py --seconds 60 --exercise-schedules --output /tmp/screen-time-soak.json
      - name: Record retained-data screen-time performance (no timing pass threshold)
        run: PYTHONPATH=. /usr/bin/python3 tests/benchmark_screen_time.py --observations 20000 --repeats 2
      - name: Check launcher syntax
        run: sh -n install.sh uninstall.sh run-timesheet run-collector run-host
  ui-scaled:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and PDF dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo python3-reportlab gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-graphene-1.0 fonts-dejavu-core xvfb xauth
      - name: Exercise mouse, keyboard and PDF workflows at 200 percent
        run: GDK_SCALE=2 GDK_BACKEND=x11 GSK_RENDERER=cairo PYTHONPATH=. xvfb-run -a -s '-screen 0 2880x2000x24' /usr/bin/python3 tests/verify_ui.py
      - name: Exercise review, timer and rule controls
        run: GDK_BACKEND=x11 GSK_RENDERER=cairo PYTHONPATH=. xvfb-run -a -s '-screen 0 1280x1000x24' /usr/bin/python3 tests/verify_improvements.py
      - name: Exercise optional AI consent and review flow
        run: GDK_SCALE=2 GDK_BACKEND=x11 GSK_RENDERER=cairo PYTHONPATH=. xvfb-run -a -s '-screen 0 2880x2000x24' /usr/bin/python3 tests/verify_jev_ui.py
      - name: Exercise assignment rule explanations and validation
        run: GDK_BACKEND=x11 GSK_RENDERER=cairo GSETTINGS_BACKEND=memory PYTHONPATH=. xvfb-run -a -s '-screen 0 1280x1000x24' /usr/bin/python3 tests/verify_rules_ui.py
      - name: Exercise guided rules and a complete daily review
        run: GDK_SCALE=2 GDK_BACKEND=x11 GSK_RENDERER=cairo GSETTINGS_BACKEND=memory PYTHONPATH=. xvfb-run -a -s '-screen 0 2880x2000x24' /usr/bin/python3 tests/verify_daily_review.py
      - name: Exercise standing consent, exception inbox and focus instructions
        run: GDK_SCALE=2 GDK_BACKEND=x11 GSK_RENDERER=cairo GSETTINGS_BACKEND=memory PYTHONPATH=. xvfb-run -a -s '-screen 0 2880x2000x24' /usr/bin/python3 tests/verify_automation_ui.py
      - name: Exercise the default click-only setup and simple day record
        run: GDK_SCALE=2 GDK_BACKEND=x11 GSK_RENDERER=cairo GSETTINGS_BACKEND=memory PYTHONPATH=. xvfb-run -a -s '-screen 0 2880x2000x24' /usr/bin/python3 tests/verify_simple_ui.py
      - name: Exercise responsive read-only insights and stale-result cancellation
        run: GDK_BACKEND=x11 GSK_RENDERER=cairo GSETTINGS_BACKEND=memory PYTHONPATH=. xvfb-run -a -s '-screen 0 1440x1000x24' /usr/bin/python3 tests/verify_screen_reader_ui.py
