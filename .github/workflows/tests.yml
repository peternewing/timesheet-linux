name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python bindings
        run: sudo apt-get update && sudo apt-get install -y python3-gi
      - name: Run accounting and collector tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile Python modules
        run: /usr/bin/python3 -m compileall -q timesheet
